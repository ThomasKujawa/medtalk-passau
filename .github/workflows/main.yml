name: Website Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check website files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required files
        shell: bash
        run: |
          test -f index.html
          test -f style.css
          test -f app.js

      - name: Show version
        shell: bash
        run: |
          if [ -f version.txt ]; then
            echo "Version: $(cat version.txt)"
          else
            echo "No version.txt found"
          fi

      - name: Create deployment package
        shell: bash
        run: |
          mkdir -p dist

          cp index.html dist/
          cp style.css dist/
          cp app.js dist/

          if [ -f version.txt ]; then
            cp version.txt dist/
          fi

          if [ -d case ]; then
            cp -r case dist/
          fi

          if [ -d img ]; then
            cp -r img dist/
          fi

          if [ -d images ]; then
            cp -r images dist/
          fi

          if [ -d assets ]; then
            cp -r assets dist/
          fi

      - name: Upload deployment package
        uses: actions/upload-artifact@v4
        with:
          name: website-files
          path: dist/